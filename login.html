<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="authentication-page">
  <h1 class="main-label">Login</h1>
  <form id="loginForm" onsubmit="login(event)">
    <div class="field">
      <label for="email">Enter Your Email:</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="password">Enter Your Password:</label>
      <input type="password" id="password" placeholder="your password..." required>
    </div>
    <div class="btn-group">
      <button type="submit">Login</button>
      <button class="btn-secondary" type="button" onclick="register()">Haven't Registred?</button>
    </div>
  </form>
  <script>
    function login(event){
      event.preventDefault();
      enteredEmail = document.getElementById("email").value;
      enteredPassword = document.getElementById("password").value;
      storedEmail = localStorage.getItem("userEmail");
      storedPassword = localStorage.getItem("userPassword");
      if (enteredEmail == storedEmail && enteredPassword == storedPassword){
        localStorage.setItem("isLoggedIn", true);
        window.location.href = "home.html";
      }
      else{
        window.alert("Wrong Email Or Password, If not registered, click register button");
      }
    }
    function register(){
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
