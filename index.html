<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="authentication-page">
  <h1 class="main-label">Register</h1>
  <form id="registrationForm" onsubmit="register(event)">
    <div class="field">
      <label for="name">Enter Your Name:</label>
      <input type="text" id="name" placeholder="Ravi Kishan" required>
    </div>
    <div class="field">
      <label for="email">Enter Your Email:</label>
      <input type="email" id="email" placeholder="ravikishan@example.com" required>
    </div>
    <div class="field">
      <label for="password">Enter a Password:</label>
      <input type="password" id="password" placeholder="enter a password" required>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="re-enter password" required>
    </div>
    <div class="btn-group">
      <button type="submit">Register</button>
      <button class="btn-secondary" type="button" onclick="loginBtn()">Login</button>
    </div>
  </form>
  <script>
    function register(event){
      event.preventDefault();
      name = document.getElementById("name").value;
      email = document.getElementById("email").value;
      password = document.getElementById("password").value;
      confirmPassword = document.getElementById("confirmPassword").value;
      if (password == confirmPassword){
        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userPassword", password);
        window.location.href = "login.html";
      }
      else{
        window.alert("Confirm Password & Password Don't Match");
      }     
    }
    function loginBtn(){
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
